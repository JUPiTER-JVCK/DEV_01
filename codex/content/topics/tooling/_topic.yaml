id: tooling
name: "Open Source Tooling"
description: "Git, Docker, Vim, regex — the tools every developer lives in daily"

lessons:
  - id: git
    title: "Git Internals"
    subtitle: "Objects, branching models, rebase, and how Git actually works"
    difficulty: intermediate
    estimated_minutes: 18
    tags: [git, version-control, commits, branches, rebase, merge, objects, DAG]
    file: tooling/01_git.yaml

  - id: docker
    title: "Docker & Containers"
    subtitle: "Images, containers, Dockerfiles, and Compose"
    difficulty: intermediate
    estimated_minutes: 16
    tags: [docker, containers, images, dockerfile, compose, layers, registry, OCI]
    file: tooling/02_docker.yaml

  - id: vim
    title: "Vim & Neovim"
    subtitle: "Modal editing, motions, macros, and the art of not using the mouse"
    difficulty: intermediate
    estimated_minutes: 15
    tags: [vim, neovim, modal, motions, macros, vimrc, lsp, telescope]
    file: tooling/03_vim.yaml

  - id: regex
    title: "Regular Expressions"
    subtitle: "Pattern matching from simple grep to full regex engines"
    difficulty: intermediate
    estimated_minutes: 14
    tags: [regex, regexp, grep, pcre, lookahead, groups, anchors, quantifiers]
    file: tooling/04_regex.yaml
