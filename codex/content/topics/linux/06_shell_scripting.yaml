id: shell_scripting
title: "Shell Scripting"
subtitle: "Bash scripting, pipes, and the Unix toolkit"
difficulty: intermediate
estimated_minutes: 18
tags: [linux, bash, shell, scripting, pipes, grep, awk, sed, find, xargs]

sections:
  - type: text
    content: |
      Shell scripting is glue — it binds together programs, automates
      repetitive tasks, and processes text. Bash (the Bourne Again Shell)
      is the default shell on most Linux distributions. Mastering pipes,
      redirections, and the classic Unix tools (grep, awk, sed, find)
      multiplies your productivity as a developer or sysadmin.

  - type: heading
    text: "Bash Script Basics"

  - type: code
    language: bash
    label: "Script structure and variables"
    code: |
      #!/usr/bin/env bash
      # Shebang line: tells OS to use bash

      set -euo pipefail   # recommended: exit on error, undefined var, pipe fail

      # Variables (no spaces around =)
      NAME="CODEX"
      COUNT=42
      RESULT=$(date +%Y-%m-%d)  # command substitution

      echo "Name: $NAME"
      echo "Count: $COUNT"
      echo "Date: $RESULT"

      # Arrays
      FILES=(a.txt b.txt c.txt)
      echo "First: ${FILES[0]}"
      echo "All: ${FILES[@]}"

      # String operations
      STR="Hello World"
      echo "${#STR}"         # length: 11
      echo "${STR,,}"        # lowercase: hello world
      echo "${STR^^}"        # uppercase: HELLO WORLD
      echo "${STR/World/Nix}" # replace: Hello Nix

  - type: heading
    text: "Control Flow"

  - type: code
    language: bash
    label: "Conditions, loops, functions"
    code: |
      # If statement
      if [[ -f /etc/os-release ]]; then
          echo "Linux system"
      elif [[ -d /tmp ]]; then
          echo "Has /tmp"
      else
          echo "Unknown"
      fi

      # Common tests: -f (file), -d (dir), -e (exists), -z (empty string),
      #                -n (non-empty), == (equal), != (not equal), -lt -gt -le -ge

      # For loop
      for file in *.txt; do
          echo "Processing: $file"
      done

      for i in {1..10}; do echo $i; done
      for i in $(seq 1 100); do echo $i; done

      # While loop
      count=0
      while [[ $count -lt 5 ]]; do
          echo "count: $count"
          ((count++))
      done

      # Functions
      greet() {
          local name="$1"   # positional arg
          echo "Hello, $name!"
      }
      greet "CODEX"

  - type: heading
    text: "The Unix Toolkit"

  - type: code
    language: bash
    label: "grep, awk, sed, find, xargs"
    code: |
      # grep — search for patterns
      grep "error" /var/log/syslog
      grep -r "TODO" ./src/        # recursive
      grep -n "function" file.py   # show line numbers
      grep -E "^[0-9]+" file.txt  # extended regex
      grep -v "debug" log.txt     # invert (exclude)

      # awk — column-based text processing
      awk '{print $1, $3}' data.txt          # print columns 1 and 3
      awk -F: '{print $1}' /etc/passwd       # use : as delimiter
      awk '$3 > 1000 {print $1}' /etc/passwd # conditional print
      ps aux | awk '{print $2, $11}'          # PIDs and commands

      # sed — stream editor for text substitution
      sed 's/old/new/g' file.txt             # replace all
      sed -i 's/foo/bar/g' file.txt          # in-place edit
      sed '/^#/d' config.conf               # delete comment lines
      sed -n '5,10p' file.txt               # print lines 5-10

      # find — search for files
      find /etc -name "*.conf"
      find . -type f -newer file.txt
      find . -name "*.py" -exec wc -l {} \;
      find /var/log -mtime +7 -delete       # delete files older than 7 days

      # xargs — build commands from stdin
      find . -name "*.txt" | xargs wc -l
      echo "a b c" | xargs -n 1 echo        # one arg per line
      cat files.txt | xargs -P 4 gzip       # parallel compression

  - type: heading
    text: "Pipes and Redirection"

  - type: code
    language: bash
    label: "I/O redirection"
    code: |
      # Pipes: output of one → input of next
      ps aux | grep nginx | grep -v grep | awk '{print $2}'
      cat /etc/passwd | cut -d: -f1 | sort | uniq

      # Redirection
      command > file.txt      # stdout to file (overwrite)
      command >> file.txt     # stdout to file (append)
      command 2> error.log    # stderr to file
      command &> all.log      # both stdout and stderr
      command < input.txt     # read stdin from file
      command 2>/dev/null     # discard errors

      # Here string
      grep "pattern" <<< "some text to search"

      # Process substitution
      diff <(sort file1.txt) <(sort file2.txt)

  - type: fact
    content: |
      Doug McIlroy invented the Unix pipe in 1973. His memo to Ken Thompson
      proposing the idea described connecting programs "like garden hoses" —
      a metaphor so apt it endures 50 years later. The pipe operator `|`
      passes the stdout of one process to the stdin of the next via a
      kernel buffer. It's one of the most elegant ideas in computing.

  - type: interactive
    prompt: "How do you redirect both stdout AND stderr to a file in bash?"
    answer: "command &> file.txt  (or: command > file.txt 2>&1)"
    hint: "& means 'all output', both stdout (1) and stderr (2)"

