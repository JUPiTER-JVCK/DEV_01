[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "codex"
version = "0.1.0"
description = "CODEX — Interactive Terminal Learning Reference"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "prompt_toolkit>=3.0.52",
    "pyyaml>=6.0",
    "pygments>=2.20.0",
]

[project.scripts]
codex = "codex.app:main"
